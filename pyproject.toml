[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "mgah-lane-distill"
version = "0.1.0"
description = "Monocular 3D lane auto-distillation: SAM 3.1 + DINOv3 + Llama vision teacher, lightweight student, Jetson Orin export."
readme = "README.md"
requires-python = ">=3.10"
authors = [{name = "kuederleR"}]
dependencies = [
    "torch>=2.2",
    "torchvision>=0.17",
    "torchaudio>=2.2",
    "transformers>=4.45",
    "accelerate>=0.34",
    "timm>=1.0.9",
    "numpy>=1.24",
    "scipy>=1.11",
    "opencv-python-headless>=4.8",
    "pillow>=10.0",
    "pydantic>=2.6",
    "requests>=2.31",
    "aiohttp>=3.9",
    "tqdm>=4.66",
    "pyyaml>=6.0",
    "python-dotenv>=1.0",
    "onnx>=1.16",
    "onnxruntime>=1.17",
    "matplotlib>=3.8",
]

[project.optional-dependencies]
viz = ["open3d>=0.18", "matplotlib>=3.8"]
nuscenes = ["nuscenes-devkit>=1.1.11"]
dev = ["pytest>=8.0"]

[tool.setuptools.packages.find]
where = ["."]
include = ["src*"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q"
